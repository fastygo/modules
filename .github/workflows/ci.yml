name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [render, markdown, view]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod

      - name: Test
        working-directory: ${{ matrix.module }}
        env:
          GOWORK: "off"
        run: |
          go test ./...
          go vet ./...
